<!-- メニュースライド（リスト型・2カラム対応） -->
<!-- 参考: 点線リーダーで価格接続、金縦棒カテゴリ見出し -->
<style>
  .menu-body {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .menu-columns {
    display: flex;
    gap: 40px;
    flex: 1;
  }

  .menu-col {
    flex: 1;
    min-width: 0;
  }

  /* カテゴリブロック（カード内） */
  .menu-category-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 24px 28px;
    margin-bottom: 20px;
  }

  .menu-category-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .menu-category-bar {
    width: 4px;
    height: 32px;
    background: var(--accent);
    flex-shrink: 0;
  }

  .menu-category-name {
    font-size: 40px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .menu-category-page {
    font-size: 32px;
    color: var(--text-muted);
    margin-left: auto;
  }

  .menu-category-note {
    font-size: 32px;
    color: var(--text-sub);
    padding: 0 0 12px 0;
    font-style: italic;
  }

  /* メニュー項目（行ベース） */
  .menu-items {
    display: flex;
    flex-direction: column;
  }

  /* 2段組み（1カテゴリ内の左右分け） */
  .menu-items-2col {
    display: flex;
    gap: 32px;
  }

  .menu-items-2col > .menu-items-col {
    flex: 1;
  }

  /* 税表記 */
  .menu-tax-note {
    font-size: 32px;
    color: var(--text-muted);
    text-align: right;
    margin-top: auto;
    padding-top: 16px;
  }
</style>

<!-- ページヘッダー -->
<div class="page-header">
  <div class="page-header-sub">{{HEADER_SUB}}</div>
  <div class="page-header-row">
    <div class="page-header-title">{{HEADER_TITLE}}</div>
    <div class="page-header-label">{{HEADER_LABEL}}</div>
  </div>
  <div class="page-header-rule"></div>
</div>

<!-- メニュー本体 -->
<div class="menu-body" id="menu-content">
  {{MENU_CONTENT}}
</div>

<div class="menu-tax-note">{{TAX_NOTE}}</div>
