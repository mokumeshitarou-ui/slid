<!-- 店情報スライド -->
<!-- 参考: 2カラム（営業時間 | アクセス・店情報）、カード型 -->
<style>
  .info-body {
    flex: 1;
    display: flex;
    gap: 40px;
  }

  .info-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* 営業時間カード */
  .hours-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 28px 32px;
    flex: 1;
  }

  .hours-block {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 6px;
  }

  .hours-block-bar {
    width: 4px;
    height: 60px;
    background: var(--accent);
    flex-shrink: 0;
    align-self: stretch;
  }

  .hours-block-content {
    flex: 1;
  }

  .hours-label {
    font-size: 36px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .hours-badge {
    display: inline-block;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 32px;
    padding: 2px 14px;
    margin-left: 12px;
  }

  .hours-time {
    font-size: 48px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 0.02em;
  }

  .hours-time-sub {
    font-size: 36px;
    color: var(--text-sub);
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
  }

  /* 情報行 */
  .info-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 20px 28px;
  }

  .info-card-label {
    font-size: 32px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .info-card-value {
    font-size: 36px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.5;
  }

  .info-card-value-accent {
    color: var(--accent);
    font-weight: 700;
  }

  /* 定休日 */
  .closed-bar {
    text-align: center;
    padding: 16px 0;
    border-top: 1px solid var(--border);
    margin-top: auto;
  }

  .closed-label {
    font-size: 34px;
    color: var(--text-sub);
  }

  .closed-value {
    font-size: 44px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .closed-note {
    font-size: 32px;
    color: var(--text-muted);
    margin-top: 4px;
  }
</style>

<!-- ページヘッダー -->
<div class="page-header">
  <div class="page-header-sub">SHOP INFORMATION</div>
  <div class="page-header-row">
    <div class="page-header-title">{{HEADER_TITLE}}</div>
    <div class="page-header-label">ACCESS &amp; HOURS</div>
  </div>
  <div class="page-header-rule"></div>
</div>

<!-- 2カラム本体 -->
<div class="info-body">
  <!-- 左カラム: 営業時間 -->
  <div class="info-col">
    <div class="section-heading">
      <div class="section-heading-bar"></div>
      <div class="section-heading-text">営業時間</div>
      <div class="section-heading-sub">Business Hours</div>
    </div>

    <div class="hours-card">
      {{HOURS_CONTENT}}
    </div>

    <div class="closed-bar">
      {{CLOSED_DAYS_CONTENT}}
    </div>
  </div>

  <!-- 右カラム: アクセス・店情報 -->
  <div class="info-col">
    <div class="section-heading">
      <div class="section-heading-bar"></div>
      <div class="section-heading-text">店舗情報</div>
      <div class="section-heading-sub">Access &amp; Info</div>
    </div>

    {{INFO_CARDS_CONTENT}}
  </div>
</div>

{{CONFLICTS_HTML}}
